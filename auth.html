<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse — подтверждение</title>
    <link rel="icon" href="assets/pulse-logo.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: radial-gradient(90% 70% at 50% 0%, #26213a 0%, #111113 60%);
        color: #ededf0;
        font: 16px/1.5 system-ui, 'Segoe UI', sans-serif;
      }
      main {
        width: min(440px, 100%);
        text-align: center;
      }
      img {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      }
      h1 {
        margin: 22px 0 8px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        color: #a3a3ad;
      }
      a.button {
        display: inline-block;
        padding: 12px 26px;
        border-radius: 999px;
        background: #f4f4f6;
        color: #111;
        font-weight: 700;
        text-decoration: none;
      }
      a.button:focus-visible {
        outline: 2px solid #b99bff;
        outline-offset: 3px;
      }
      .error {
        color: #ff9a9d;
      }
      small {
        display: block;
        margin-top: 18px;
        color: #9a9aa5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/pulse-logo.png" alt="Pulse" />
      <h1 id="title">Возвращаемся в Pulse…</h1>
      <p id="text">Сейчас откроется Pulse. Если этого не произошло — нажмите кнопку.</p>
      <a class="button" id="open" href="pulse://">Открыть Pulse</a>
      <small>Эту вкладку можно закрыть.</small>
    </main>
    <script>
      // Supabase возвращает сюда после ссылки из письма: ?code=... (или #error=...).
      // Передаём код в приложение по ссылке pulse://auth — дальше вход происходит в самом Pulse.
      const params = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.slice(1));
      const code = params.get('code');
      const flow = params.get('flow') === 'recovery' ? 'recovery' : 'signup';
      const error = params.get('error_description') || hash.get('error_description');
      const title = document.getElementById('title');
      const text = document.getElementById('text');
      const open = document.getElementById('open');
      if (error) {
        title.textContent = 'Ссылка не сработала';
        text.textContent = /expired|invalid/i.test(error)
          ? 'Ссылка устарела или уже использована. Запросите новое письмо в Pulse.'
          : error;
        text.className = 'error';
      } else if (code) {
        title.textContent = flow === 'recovery' ? 'Смена пароля' : 'Почта подтверждена';
        text.textContent = flow === 'recovery' ? 'Возвращаемся в Pulse, чтобы задать новый пароль.' : 'Возвращаемся в Pulse — вы войдёте автоматически.';
        const link = 'pulse://auth?' + new URLSearchParams({ code, flow });
        open.href = link;
        location.href = link;
      } else {
        title.textContent = 'Почта подтверждена';
        text.textContent = 'Вернитесь в Pulse и войдите с почтой и паролем.';
      }
    </script>
  </body>
</html>
